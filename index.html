<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#7b2ff7"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"><title>FART MACHINE</title><style>body{margin:0;background:radial-gradient(circle at top left,#7d2af9,transparent 60%),#180d37;color:white;font-family:system-ui;text-align:center}main{max-width:900px;margin:auto;padding:20px}h1{font-size:clamp(38px,8vw,76px);text-shadow:5px 5px #ff3985}h2{color:#fff69b}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:24px}.sound{border:3px solid white;border-bottom-width:8px;border-radius:22px;min-height:145px;color:white;font-weight:900;font-size:clamp(13px,2.5vw,22px);touch-action:manipulation;cursor:pointer}.sound:active{transform:translateY(5px)}.sound span{display:block;font-size:clamp(36px,7vw,68px)}.sound:nth-child(9n+1){background:#fe5d7e}.sound:nth-child(9n+2){background:#ff9c20}.sound:nth-child(9n+3){background:#10bdbe}.sound:nth-child(9n+4){background:#9a62f6}.sound:nth-child(9n+5){background:#9dcf2e}.sound:nth-child(9n+6){background:#e74431}.sound:nth-child(9n+7){background:#2e91f5}.sound:nth-child(9n+8){background:#ff56c8}.sound:nth-child(9n+9){background:#d3a221}label{display:inline-block;margin:8px;padding:12px;border-radius:30px;background:#ffffff33}button{font-family:inherit}#stop{border:0;border-radius:30px;padding:13px;background:#fff;font-weight:bold}@media(max-width:520px){.sound{min-height:110px;border-radius:15px}.grid{gap:7px}main{padding:10px}}</style></head><body><main><h1>💨 FART MACHINE 💥</h1><h2>TRYCK • SKRATTA • UPPREPA</h2><label>🔊 Volym <input id="vol" type="range" min="0" max="100" value="75"></label><label><input id="layer" type="checkbox" checked> Fisorkester 🎼</label><button id="stop">🛑 Stoppa allt</button><div class="grid" id="grid"></div><p id="status">👆 Välj din fis!</p><p>100% syntetiska fisar • Offline • Inga annonser</p></main><script>
const sounds=[["💨","Smygaren",.48,95,.24,.1],["💥","Kanonen",1.15,56,.9,.8],["🫧","Blöta",1.5,110,.52,.65],["🎺","Trumpeten",1.9,165,.38,.22],["🦆","Ankan",.58,235,.48,.55],["🌋","Vulkanen",2.9,48,.94,.82],["⚡","Snabbisen",.22,145,.35,.35],["🚀","Raketen",2.2,90,.7,.45],["☢️","Katastrofen",3.6,63,.96,.9]];let ctx,master,active=[];const vol=document.getElementById("vol"),status=document.getElementById("status");function setup(){if(!ctx){ctx=new(window.AudioContext||window.webkitAudioContext)();master=ctx.createGain();master.connect(ctx.destination)}ctx.resume();master.gain.setTargetAtTime(vol.value/140,ctx.currentTime,.02)}vol.oninput=()=>{if(ctx)master.gain.setTargetAtTime(vol.value/140,ctx.currentTime,.02)};function stop(){active.forEach(x=>{try{x.stop()}catch(e){}});active=[];status.textContent="🤫 Tyst!"}document.getElementById("stop").onclick=stop;function play(i){setup();if(!document.getElementById("layer").checked)stop();const s=sounds[i],dur=s[2],sr=ctx.sampleRate,b=ctx.createBuffer(1,Math.ceil(dur*sr),sr),d=b.getChannelData(0);let phase=0,low=0,rng=i+131;function rand(){rng=(rng*1664525+1013904223)>>>0;return rng/2147483648-1}for(let n=0;n<d.length;n++){const t=n/sr,p=t/dur,env=Math.min(1,t/.025)*Math.pow(1-p,.8),freq=s[3]*(1-.48*p+.14*Math.sin(2*Math.PI*(5+s[5]*10)*t));phase+=2*Math.PI*freq/sr;const noise=rand();low=low*.86+noise*.14;const flutter=Math.sin(2*Math.PI*(13+s[4]*28)*t);const voiced=Math.sin(phase+1.4*Math.sin(phase*.52))*.48+Math.sin(phase*2.03)*.19;d[n]=Math.tanh((voiced*(.65+flutter*.3)+(noise*.25+low*.7)*(.25+s[4]*.9))*env*1.7)*.55}const src=ctx.createBufferSource(),filter=ctx.createBiquadFilter();filter.type="lowpass";filter.frequency.value=800+s[5]*1100;src.buffer=b;src.connect(filter);filter.connect(master);src.start();active.push(src);src.onended=()=>active=active.filter(x=>x!==src);status.textContent=s[0]+" "+s[1]+"!!!"}sounds.forEach((s,i)=>{const b=document.createElement("button");b.className="sound";b.innerHTML="<span>"+s[0]+"</span>"+s[1];b.onclick=()=>play(i);document.getElementById("grid").appendChild(b)});if("serviceWorker"in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js"));
</script></body></html>
